/**:
  ros__parameters:
    joy_topic: /joy
    body_pose_topic: body_pose
    cmd_vel_topic: cmd_vel
    tx_topic: /can_tx_frames
    rx_topic: /can_rx_frames
    gate_topic: /power_sequence/gate_open
    state_topic: /power_sequence/state
    command_topic: /power_sequence/command

    can_tx_frames_qos_depth: 4000
    motor_master_id: 253

    # 默认按键（PS4/Linux 常见：□=3 ○=1）：L1+R1 或 □长按 上电/start；L1+R1+Share 下电；○长按 prone（保持使能）
    # Share + Options 长按：一次性电机初始化（写 zero_sta=1 并保存，断电重启后生效）
    # button_square: -1 可关闭「□ = start」
    button_l1: 4
    button_r1: 5
    button_share: 8
    button_circle: 1
    button_square: 3
    start_longpress_s: 1.0
    shutdown_longpress_s: 1.0
    prone_longpress_s: 0.8

    # 趴下/下电 SoftProne：起点 z 默认跟踪 /body_pose（与 teleop 同语义：相对 nominal_height 的增量），避免“先抬回 stand_z 再趴”
    # 站起 SoftStand（从 ProneHold 或趴下动画末尾挂起 start）：目标 z 使用趴下前记录的 stand_resume_z（非仅 stand_z）
    track_body_pose_height: true
    body_pose_stale_s: 2.0
    track_z_clamp_min: -0.5
    track_z_clamp_max: 0.5

    # 启停时序（秒）
    timer_period_ms: 20
    precheck_duration_s: 0.20
    init_hold_duration_s: 0.35
    stand_duration_s: 2.50
    prone_duration_s: 2.50

    # body_pose.position.z 目标（相对 nominal_height 的增量）
    stand_z: 0.0
    prone_z: -0.2

    # RQ-024：维修后机械零位（与 URDF joint_offsets 标定不同层）。仅 Idle、门禁关、未使能流程时允许。
    # 注意：Options 单独长按才触发 set_zero；同时按住 Share 时走「一次性电机初始化」，不会 set_zero。
    enable_remote_set_zero: true
    # PS4 Options：内核 joy 下标因驱动而异，务必 ros2 topic echo /joy 实测后填写；-1 关闭手柄触发（仍可用 /power_sequence/command set_zero）
    button_option: 9
    # Options 长按生效秒数（防误触）
    set_zero_longpress_s: 2.0
    # 非空则发布 set_zero_ok / set_zero_rejected:... 事件，便于联调或上层记录
    set_zero_event_topic: ""
    # 遥控/话题 set_zero 成功后：完整 12 电机 set_zero 帧重复次数（提高可靠性）；轮与轮之间间隔毫秒（略大于 el05 脚本 SLEEP_MS 思路）
    set_zero_repeat_count: 3
    set_zero_repeat_interval_ms: 40

    # --- 一次性电机初始化（Share + Options 长按 3s）---
    # 只配置断电位置域 zero_sta(0x7029)=1（上电按 -π~π 重建，即 ±180°），不改机械零位。
    # 流程：写 0x7029 -> CMD 0x16 保存 flash -> CMD 0x11 回读校验；写后需断电重启才生效。
    # 仅 Idle 且门禁关闭时允许；初始化期间屏蔽 start/shutdown/prone。
    enable_remote_motor_init: true
    motor_init_longpress_s: 3.0
    motor_init_zero_sta: 1
    motor_init_tick_ms: 50
    motor_init_set_wait_ms: 200
    motor_init_save_wait_ms: 500
    motor_init_read_wait_ms: 600
    # 非空则发布 motor_init_ok / motor_init_fail / motor_init_rejected / zero_sta_verify_* 事件
    motor_init_event_topic: ""
    # 上电只读自检：回读 12 路 zero_sta，不等于目标值时告警（不写参数）
    verify_zero_sta_at_launch: true
    zero_sta_verify_delay_s: 1.0

    # --- 日常上电：不再 set_zero、不再发 MIT p=0 ---
    send_enable_in_startup: true
    # 使能后按各电机当前反馈角发一帧 MIT 保持（p=feedback），避免绕圈回零/站立脉冲
    send_mit_hold_in_startup: true
    # 12/12 反馈新鲜才允许使能；缺失时中止 start，且一个使能帧都不发
    # 依赖 0x18 主动上报（enable_active_report_* 需为 true）
    require_feedback_before_enable: true
    motor_feedback_fresh_timeout_s: 1.0

    # 主动上报（通信类型 24 / CAN ID 0x18）：与 0x02 反馈同数据域，motor_protocol 统一解析；上电无查询反馈时 RViz 仍可刷新。
    # 下电 Disable 仅发失能，不关闭主动上报，便于 RViz 在全生命周期内仍能看到实际关节（关上报请用 el05_motor_cansend.sh reset 等）
    enable_active_report_in_startup: true
    # launch 后 Idle 即发一次 0x7026 + 上报 ON（无需等 start），便于 RViz 反馈模型尽早有实测角
    enable_active_report_at_launch: true
    # 延迟秒数：略晚于 can_transport 订阅 /can_tx_frames，避免首包丢失
    active_report_boot_delay_s: 0.25
    # 目标频率（Hz），内部写入 0x7026 EPScan_time（换算同 el05_motor_cansend.sh）
    active_report_hz: 10.0
    # 上报帧 ID 内主站字节；-1 表示与 motor_master_id 相同（若手册要求主站 0，可改为 0）
    active_report_master_id: -1

    # MIT 保持首帧参数：p=各电机当前反馈角，v=init_velocity，kp/kd 用下列值（与 control_gains.yaml 默认一致）
    init_kp: 50.0
    init_kd: 2.5
    init_velocity: 0.0
    init_tau: 0.0

